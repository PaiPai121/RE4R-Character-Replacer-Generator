<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RE4 · Character Replacer</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app">
<header><div class="wordmark">RESIDENT EVIL <b>4</b></div><h1 data-i18n="appHeading">Character Replacer</h1><button id="languageButton" class="language-toggle" type="button">中文</button><button id="refreshButton" class="icon" data-i18n-title="refreshUi" data-i18n-aria-label="refreshUi">↻</button></header>
<div class="workspace"><section class="viewer" data-i18n-aria-label="viewerAria">
<div id="previewStage"><div class="empty-preview"><span class="crosshair">＋</span><p data-i18n="noModel">No model selected</p></div></div>
<div id="taskProgress" hidden role="status" aria-live="polite"><p id="taskPhase"></p><progress data-i18n-aria-label="taskRunning"></progress><p id="taskTime"></p><p id="taskHeartbeat"></p></div>
<div class="view-controls" id="viewControls" hidden><button data-view="front" data-i18n="front">Front</button><button data-view="back" data-i18n="back">Back</button><button data-view="side" data-i18n="side">Side</button><button data-view="hands" data-i18n="leftHand">Left hand</button><button data-view="rightHand" data-i18n="rightHand">Right hand</button></div>
<div class="guide-legend" id="guideLegend" hidden><span class="source-guide" data-i18n="sourceGuide">Source model</span><span class="left-guide" data-i18n="targetLeft">Target left</span><span class="right-guide" data-i18n="targetRight">Target right</span></div>
<div class="viewer-caption"><span id="selectedSourceText">—</span><span id="viewLabel" data-i18n="poseAlignment">Pose alignment</span></div></section>
<aside><h2 data-i18n="settings">Replacement settings</h2>
<button class="menu-row" id="targetButton"><span data-i18n="gameCharacter">Game character</span><strong id="selectedTargetText" data-i18n="selectCharacter">Select character</strong><span>›</span></button>
<button class="menu-row" id="browseButton"><span data-i18n="replacementModel">Replacement model</span><strong id="sourceLabel" data-i18n="selectModel">Select model</strong><span>›</span></button>
<input id="sourcePath" type="text" data-i18n-aria-label="modelPathAria" data-i18n-placeholder="modelPathPlaceholder" spellcheck="false">
<div class="separator"></div><div class="status" role="status"><span id="statusText" data-i18n="waitingSelection">Waiting for selection</span><progress id="progress" hidden></progress></div>
<button class="command" id="previewButton" disabled data-i18n="refreshPreview">Refresh preview</button><button class="command" id="adjustButton" disabled><span data-i18n="adjustBlender">Adjust in Blender</span> <small data-i18n="optional">Optional</small></button>
<button class="command primary" id="buildButton" disabled><span data-i18n="generateMod">Generate Mod</span> <span>›</span></button>
<section id="buildResult" hidden data-i18n-aria-label="buildResultAria"><p class="result-title" data-i18n="savedLocally">Saved on this computer</p><a id="download" class="command" hidden download data-i18n="downloadMod">Download Mod</a><label for="outputPath" data-i18n="fileLocation">File location</label><textarea id="outputPath" readonly rows="3"></textarea><button id="copyOutput" class="command" data-i18n="copyPath">Copy path</button></section>
<details id="diagnostics"><summary data-i18n="taskHistory">Task history</summary><pre id="jobBox" data-i18n="noTasks">No tasks yet</pre></details></aside></div>
<footer><span id="scanStatus" data-i18n="localResources">Local resources</span><span id="connectionStatus" data-i18n="connecting">Connecting</span></footer></main>
<dialog id="targetDialog"><div class="dialog-heading"><h2 data-i18n="chooseGameCharacter">Select game character</h2><button class="icon close" data-i18n-aria-label="close">×</button></div><input id="targetSearch" type="search" data-i18n-placeholder="searchCharacter" data-i18n-aria-label="searchCharacter"><div id="targetList" class="options"></div><details><summary data-i18n="gameDirectory">Game directory</summary><input id="gamePath" data-i18n-aria-label="gameDirectory" spellcheck="false"><button id="scanGameButton" class="command" data-i18n="scanGame">Scan game</button></details></dialog>
<dialog id="modelDialog"><div class="dialog-heading"><h2 data-i18n="chooseModel">Select model</h2><button class="icon close" data-i18n-aria-label="close">×</button></div>
<div class="picker-tabs" role="tablist" data-i18n-aria-label="modelSource"><button id="knownModelsTab" role="tab" aria-selected="true" aria-controls="knownModelsPanel" data-i18n="knownModels">Known models</button><button id="diskModelsTab" role="tab" aria-selected="false" aria-controls="diskModelsPanel" data-i18n="browseFiles">Browse files</button></div>
<div id="knownModelsPanel" role="tabpanel"><input id="modelSearch" type="search" data-i18n-placeholder="searchModel" data-i18n-aria-label="searchModel"><div id="modelList" class="options"></div></div>
<div id="diskModelsPanel" role="tabpanel" hidden><form id="folderForm" class="folder-bar"><button id="parentFolder" type="button" class="icon" data-i18n-title="parentFolder" data-i18n-aria-label="parentFolder">↑</button><input id="folderPath" data-i18n-aria-label="folderPath" spellcheck="false"><button class="icon" type="submit" data-i18n-title="openFolder" data-i18n-aria-label="openFolder">→</button></form><div id="driveList" class="drive-list" data-i18n-aria-label="drives"></div><input id="fileSearch" type="search" data-i18n-placeholder="searchFolder" data-i18n-aria-label="searchFolder"><p id="pickerStatus" role="status"></p><div id="fileList" class="options"></div></div>
</dialog><script src="/i18n.js"></script><script src="/app.js"></script></body></html>
